[pytest]
python_files = test_*.py
# --ds, not the DJANGO_SETTINGS_MODULE ini key: pytest-django's precedence is
# command line > environment > ini, so the ini key alone loses to a developer
# who already has DJANGO_SETTINGS_MODULE exported in their shell. That would
# silently run the suite under dev settings -- debug toolbar loaded, PBKDF2
# instead of the fast test hasher -- so a green local run would stop meaning
# what CI means by it.
addopts = --ds=config.settings.test --strict-markers --strict-config -ra
testpaths = accounts chores config core schedule
filterwarnings =
    error::DeprecationWarning
    default::DeprecationWarning:debug_toolbar.*
