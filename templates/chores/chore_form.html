{% extends "base.html" %}
{% block title %}{% if chore %}Edit{% else %}New{% endif %} chore{% endblock %}
{% block content %}
<div class="card card--narrow">
  <h1>{% if chore %}Edit “{{ chore.name }}”{% else %}Add a chore{% endif %}</h1>
  <form method="post" novalidate>
    {% csrf_token %}
    {% include "accounts/_form.html" %}
    <button type="submit" class="btn">Save</button>
    <a class="cancel" href="{% url 'chore_list' %}">Cancel</a>
  </form>
</div>
{% endblock %}
